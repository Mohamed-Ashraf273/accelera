repos:
  - repo: local
    hooks:
      - id: api-gen
        name: api_gen
        entry: |
          bash shell/api_gen.sh
          untracked=$(git ls-files --others --exclude-standard -- accelera/api)
          if ! git diff --quiet -- accelera/api || [ -n "$untracked" ]; then
            echo "Please run shell/api_gen.sh to generate API."
            exit 1
          fi
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
        require_serial: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--config, pyproject.toml, --fix, .]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        args: [--config, pyproject.toml, .]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff
        args: [--config, pyproject.toml, .]
        pass_filenames: false
        stages: [manual]
      - id: ruff-format
        args: ["--check", --config, pyproject.toml, .]
        pass_filenames: false
        stages: [manual]
